<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settlers of Catan</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Alegreya+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --wood: #2d5a27;
    --wood-light: #4a8c3f;
    --brick: #c1440e;
    --brick-light: #e8621a;
    --sheep: #8db600;
    --sheep-light: #a8d600;
    --wheat: #daa520;
    --wheat-light: #f0c040;
    --ore: #5a5a6e;
    --ore-light: #7a7a90;
    --desert: #d2b48c;
    --desert-light: #e8d4b8;
    --ocean: #1a4a6e;
    --ocean-deep: #0d2b40;
    --sand: #f5e6c8;
    --parchment: #f0e4d0;
    --ink: #2c1810;
    --red-player: #d64045;
    --blue-player: #4a90d9;
    --green-player: #45a049;
    --orange-player: #e8922f;
  }

  body {
    font-family: 'Alegreya Sans', sans-serif;
    background: var(--ocean-deep);
    color: var(--parchment);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  .ocean-bg {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(26, 74, 110, 0.8) 0%, transparent 60%),
      radial-gradient(ellipse at 70% 80%, rgba(26, 74, 110, 0.6) 0%, transparent 50%),
      linear-gradient(180deg, #0d2b40 0%, #163d5c 40%, #1a4a6e 70%, #0d2b40 100%);
    z-index: 0;
  }

  .ocean-bg::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
    opacity: 0.4;
  }

  .game-container {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 260px 1fr 280px;
    height: 100vh;
    gap: 0;
  }

  .left-panel {
    background: linear-gradient(135deg, rgba(13, 43, 64, 0.95), rgba(22, 61, 92, 0.9));
    border-right: 1px solid rgba(240, 228, 208, 0.1);
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
    backdrop-filter: blur(10px);
  }

  .game-title {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 900;
    text-align: center;
    color: var(--wheat-light);
    letter-spacing: 2px;
    text-transform: uppercase;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(218, 165, 32, 0.3);
    text-shadow: 0 2px 8px rgba(218, 165, 32, 0.3);
  }

  .player-card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    padding: 12px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .player-card.active {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.2);
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
  }

  .player-card.active::before {
    content: '\25B6';
    position: absolute;
    right: 10px;
    top: 10px;
    font-size: 10px;
    color: var(--wheat-light);
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .player-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .player-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 8px rgba(0,0,0,0.3);
  }

  .player-name {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 14px;
    flex: 1;
  }

  .player-vp {
    font-family: 'Cinzel', serif;
    font-size: 18px;
    font-weight: 900;
    color: var(--wheat-light);
  }

  .player-resources {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }

  .res-badge {
    display: flex;
    align-items: center;
    gap: 3px;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 6px;
    padding: 2px 6px;
    font-size: 11px;
    font-weight: 500;
  }

  .res-icon { font-size: 12px; }

  .player-buildings {
    display: flex;
    gap: 8px;
    margin-top: 6px;
    font-size: 11px;
    opacity: 0.7;
  }

  .card-count {
    font-size: 12px;
    opacity: 0.7;
    padding: 4px 0;
  }

  .lr-badge {
    display: inline-block;
    background: rgba(218, 165, 32, 0.3);
    border: 1px solid rgba(218, 165, 32, 0.5);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 10px;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    color: var(--wheat-light);
    margin-left: 4px;
  }

  .board-area {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  canvas#board {
    display: block;
  }

  .right-panel {
    background: linear-gradient(135deg, rgba(13, 43, 64, 0.95), rgba(22, 61, 92, 0.9));
    border-left: 1px solid rgba(240, 228, 208, 0.1);
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    overflow-y: auto;
    backdrop-filter: blur(10px);
  }

  .section-label {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--wheat-light);
    opacity: 0.7;
  }

  .dice-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .dice-row { display: flex; gap: 16px; }

  .die {
    width: 54px;
    height: 54px;
    background: linear-gradient(145deg, #f5f0e8, #e0d5c0);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cinzel', serif;
    font-size: 26px;
    font-weight: 900;
    color: var(--ink);
    box-shadow: 0 3px 8px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.5);
    transition: transform 0.3s;
    user-select: none;
  }

  .die.rolling { animation: diceShake 0.4s ease-in-out; }

  @keyframes diceShake {
    0%, 100% { transform: rotate(0deg) scale(1); }
    20% { transform: rotate(-15deg) scale(1.1); }
    40% { transform: rotate(10deg) scale(0.95); }
    60% { transform: rotate(-5deg) scale(1.05); }
    80% { transform: rotate(3deg) scale(1); }
  }

  .dice-total {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--wheat-light);
    opacity: 0.8;
  }

  .btn {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1px;
    padding: 10px 16px;
    border: 1px solid rgba(240, 228, 208, 0.2);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--parchment);
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    width: 100%;
  }

  .btn:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(240, 228, 208, 0.35);
    transform: translateY(-1px);
  }

  .btn:active:not(:disabled) { transform: translateY(0); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .btn.primary {
    background: linear-gradient(135deg, rgba(218, 165, 32, 0.3), rgba(218, 165, 32, 0.15));
    border-color: rgba(218, 165, 32, 0.4);
    color: var(--wheat-light);
  }

  .btn.primary:hover:not(:disabled) {
    background: linear-gradient(135deg, rgba(218, 165, 32, 0.4), rgba(218, 165, 32, 0.25));
  }

  .btn-sm { padding: 6px 10px; font-size: 11px; }

  .build-options { display: flex; flex-direction: column; gap: 6px; }
  .build-btn { display: flex; align-items: center; justify-content: space-between; text-align: left; }
  .build-cost { display: flex; gap: 3px; font-size: 12px; }

  .log-area { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  .log-messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 8px 0;
    min-height: 100px;
  }

  .log-msg {
    font-size: 12px;
    line-height: 1.4;
    opacity: 0.75;
    padding: 3px 0;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }

  .log-msg .highlight { color: var(--wheat-light); font-weight: 500; }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }

  .modal-overlay.show { display: flex; }

  .modal {
    background: linear-gradient(145deg, #1a3a52, #0d2b40);
    border: 1px solid rgba(240, 228, 208, 0.15);
    border-radius: 16px;
    padding: 28px;
    min-width: 380px;
    max-width: 440px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }

  .modal h3 {
    font-family: 'Cinzel', serif;
    font-size: 18px;
    color: var(--wheat-light);
    margin-bottom: 20px;
    text-align: center;
  }

  .trade-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    padding: 8px 12px;
    background: rgba(0,0,0,0.2);
    border-radius: 8px;
  }

  .trade-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    min-width: 90px;
  }

  .trade-controls { display: flex; align-items: center; gap: 8px; }

  .trade-controls button {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid rgba(240, 228, 208, 0.2);
    background: rgba(255, 255, 255, 0.08);
    color: var(--parchment);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }

  .trade-controls button:hover { background: rgba(255, 255, 255, 0.15); }
  .trade-controls span { width: 24px; text-align: center; font-weight: 700; font-size: 16px; }

  .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
  .modal-btns .btn { flex: 1; }

  .steal-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 16px 0;
  }

  .steal-option-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border: 1px solid rgba(240, 228, 208, 0.2);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--parchment);
    cursor: pointer;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 14px;
    transition: all 0.2s;
    width: 100%;
  }

  .steal-option-btn:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(240, 228, 208, 0.35);
  }

  .steal-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .discard-info {
    text-align: center;
    font-size: 14px;
    margin-bottom: 16px;
    color: var(--parchment);
    opacity: 0.8;
  }

  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: linear-gradient(135deg, rgba(218, 165, 32, 0.95), rgba(192, 140, 20, 0.95));
    color: var(--ink);
    padding: 12px 24px;
    border-radius: 10px;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 14px;
    z-index: 200;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    text-align: center;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  .instruction-banner {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.7);
    color: var(--wheat-light);
    padding: 8px 20px;
    border-radius: 20px;
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 700;
    z-index: 10;
    pointer-events: none;
    white-space: nowrap;
    border: 1px solid rgba(218, 165, 32, 0.3);
    backdrop-filter: blur(8px);
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(240, 228, 208, 0.15); border-radius: 2px; }

  @media (max-width: 1100px) {
    .game-container { grid-template-columns: 220px 1fr 240px; }
  }

  @media (max-width: 860px) {
    .game-container {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr auto;
      height: auto;
      min-height: 100vh;
    }
    .left-panel {
      flex-direction: row;
      flex-wrap: wrap;
      border-right: none;
      border-bottom: 1px solid rgba(240, 228, 208, 0.1);
    }
    .player-card { flex: 1; min-width: 160px; }
    .board-area { min-height: 400px; }
    .right-panel { border-left: none; border-top: 1px solid rgba(240, 228, 208, 0.1); }
  }
</style>
</head>
<body>

<div class="ocean-bg"></div>

<div class="game-container">
  <div class="left-panel">
    <div class="game-title">Catan</div>
    <div id="players-container"></div>
  </div>

  <div class="board-area" id="boardArea">
    <canvas id="board"></canvas>
    <div class="instruction-banner" id="instructionBanner">Click a highlighted spot to place a settlement</div>
  </div>

  <div class="right-panel">
    <div class="section-label">Dice</div>
    <div class="dice-area">
      <div class="dice-row">
        <div class="die" id="die1">&ndash;</div>
        <div class="die" id="die2">&ndash;</div>
      </div>
      <div class="dice-total" id="diceTotal"></div>
      <button class="btn primary" id="rollBtn" onclick="rollDice()" title="Roll Dice (R)">Roll Dice</button>
    </div>

    <div class="section-label" style="margin-top:6px">Build</div>
    <div class="build-options">
      <button class="btn build-btn btn-sm" id="buildRoadBtn" onclick="startBuild('road')" disabled title="Build Road (1)">
        <span>&#x1F6E4;&#xFE0F; Road</span>
        <span class="build-cost">&#x1FAB5;&#x1F9F1;</span>
      </button>
      <button class="btn build-btn btn-sm" id="buildSettlementBtn" onclick="startBuild('settlement')" disabled title="Build Settlement (2)">
        <span>&#x1F3E0; Settlement</span>
        <span class="build-cost">&#x1FAB5;&#x1F9F1;&#x1F33E;&#x1F411;</span>
      </button>
      <button class="btn build-btn btn-sm" id="buildCityBtn" onclick="startBuild('city')" disabled title="Build City (3)">
        <span>&#x1F3D9;&#xFE0F; City</span>
        <span class="build-cost">&#x1F33E;&#x1F33E;&#x26CF;&#xFE0F;&#x26CF;&#xFE0F;&#x26CF;&#xFE0F;</span>
      </button>
    </div>

    <button class="btn btn-sm" id="tradeBankBtn" onclick="openTrade()" title="Bank Trade (T)">&#x1F504; Bank Trade (4:1)</button>
    <button class="btn btn-sm" id="endTurnBtn" onclick="endTurn()" disabled title="End Turn (E)">End Turn</button>

    <div class="section-label" style="margin-top:6px">Game Log</div>
    <div class="log-area">
      <div class="log-messages" id="logMessages"></div>
    </div>

    <button class="btn btn-sm" onclick="confirmNewGame()">New Game</button>
  </div>
</div>

<!-- Trade Modal -->
<div class="modal-overlay" id="tradeModal">
  <div class="modal">
    <h3>Bank Trade (4:1)</h3>
    <div class="section-label" style="margin-bottom:8px">Give (4 of one resource)</div>
    <div id="tradeGive"></div>
    <div class="section-label" style="margin:12px 0 8px">Receive (1 resource)</div>
    <div id="tradeReceive"></div>
    <div class="modal-btns">
      <button class="btn" onclick="closeTrade()">Cancel</button>
      <button class="btn primary" onclick="executeTrade()">Trade</button>
    </div>
  </div>
</div>

<!-- Steal Modal -->
<div class="modal-overlay" id="stealModal">
  <div class="modal">
    <h3>Steal a Resource</h3>
    <p class="discard-info">Choose a player to steal from:</p>
    <div class="steal-options" id="stealOptions"></div>
  </div>
</div>

<!-- Discard Modal -->
<div class="modal-overlay" id="discardModal">
  <div class="modal">
    <h3 id="discardTitle">Discard Cards</h3>
    <p class="discard-info" id="discardInfo"></p>
    <div id="discardResources"></div>
    <div class="modal-btns">
      <button class="btn primary" id="discardConfirmBtn" onclick="executeDiscard()" disabled>Confirm</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================
// CONSTANTS
// ============================================

const RESOURCES = ['wood', 'brick', 'wheat', 'sheep', 'ore'];
const RES_COLORS = { wood: '#2d5a27', brick: '#c1440e', wheat: '#daa520', sheep: '#8db600', ore: '#5a5a6e', desert: '#d2b48c' };
const RES_LIGHT = { wood: '#4a8c3f', brick: '#e8621a', wheat: '#f0c040', sheep: '#a8d600', ore: '#7a7a90', desert: '#e8d4b8' };
const RES_EMOJI = { wood: '\u{1FAB5}', brick: '\u{1F9F1}', wheat: '\u{1F33E}', sheep: '\u{1F411}', ore: '\u26CF\uFE0F' };
const PLAYER_COLORS = ['#d64045', '#4a90d9', '#45a049', '#e8922f'];
const PLAYER_NAMES = ['Red', 'Blue', 'Green', 'Orange'];
const HEX_ROWS = [3, 4, 5, 4, 3];

const TILE_RESOURCES = [
  'ore','wheat','wood',
  'brick','sheep','sheep','wheat',
  'wood','ore','wheat','wood','brick','desert',
  'sheep','brick','ore','wheat',
  'wood','sheep'
];

const STANDARD_NUMBERS = [10,2,9,12,6,4,10,9,11,3,8,8,3,4,5,5,6,11];

const MAX_SETTLEMENTS = 5;
const MAX_CITIES = 4;
const MAX_ROADS = 15;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ============================================
// STATE
// ============================================

function createInitialState() {
  return {
    phase: 'setup1',
    currentPlayer: 0,
    players: [],
    hexes: [],
    vertices: [],
    edges: [],
    robberHex: -1,
    diceRoll: null,
    hasRolled: false,
    buildMode: null,
    winner: null,
    setupSettlement: false,
    setupRoad: false,
    turnOrder: [0, 1, 2, 3, 3, 2, 1, 0],
    setupIndex: 0,
    hoveredVertex: -1,
    hoveredEdge: -1,
    discardQueue: [],
    pendingRobber: false,
    longestRoadPlayer: -1,
  };
}

let state = createInitialState();

// ============================================
// GEOMETRY
// ============================================

const HEX_SIZE = 52;
const HEX_HORIZ = HEX_SIZE * 1.52;
const HEX_VERT = HEX_SIZE * Math.sqrt(3) * 0.98;
let hexCenters = [];
let canvas, ctx;
let boardOffsetX = 0, boardOffsetY = 0;

function getMousePos(event) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (event.clientX - rect.left) * scaleX,
    y: (event.clientY - rect.top) * scaleY,
  };
}

function initBoard() {
  canvas = document.getElementById('board');
  const area = document.getElementById('boardArea');
  const dpr = window.devicePixelRatio || 1;

  const w = area.clientWidth;
  const h = area.clientHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  boardOffsetX = w / 2;
  boardOffsetY = h / 2;

  // Shuffle tile resources for random board
  const shuffledResources = shuffle(TILE_RESOURCES);

  // Calculate hex centers
  hexCenters = [];
  let idx = 0;
  const totalRows = HEX_ROWS.length;

  for (let row = 0; row < totalRows; row++) {
    const count = HEX_ROWS[row];
    const rowOffset = (count - 1) / 2;
    for (let col = 0; col < count; col++) {
      const x = (col - rowOffset) * HEX_HORIZ;
      const y = (row - (totalRows - 1) / 2) * HEX_VERT;
      hexCenters.push({ x, y, idx });
      idx++;
    }
  }

  // Build hex data with shuffled resources
  let numIdx = 0;
  state.hexes = hexCenters.map((center, i) => {
    const resource = shuffledResources[i];
    return {
      x: center.x, y: center.y,
      resource,
      number: resource === 'desert' ? 0 : STANDARD_NUMBERS[numIdx++],
      hasRobber: resource === 'desert',
      vertices: [],
    };
  });

  state.robberHex = state.hexes.findIndex(h => h.resource === 'desert');

  // Calculate vertices (corners of hexes, deduplicated)
  const vertexMap = new Map();
  const vertexPositions = [];

  state.hexes.forEach((hex, hi) => {
    hex.vertices = [];
    for (let i = 0; i < 6; i++) {
      const angle = (Math.PI / 3) * i - Math.PI / 6;
      const vx = hex.x + HEX_SIZE * Math.cos(angle);
      const vy = hex.y + HEX_SIZE * Math.sin(angle);
      const key = `${Math.round(vx * 10)},${Math.round(vy * 10)}`;
      if (!vertexMap.has(key)) {
        vertexMap.set(key, vertexPositions.length);
        vertexPositions.push({ x: vx, y: vy, hexes: [], building: null, player: -1 });
      }
      hex.vertices.push(vertexMap.get(key));
      vertexPositions[vertexMap.get(key)].hexes.push(hi);
    }
  });

  state.vertices = vertexPositions;

  // Calculate edges
  const edgeMap = new Map();
  const edgePositions = [];

  state.hexes.forEach(hex => {
    for (let i = 0; i < 6; i++) {
      const v1 = hex.vertices[i];
      const v2 = hex.vertices[(i + 1) % 6];
      const key = [Math.min(v1, v2), Math.max(v1, v2)].join('-');
      if (!edgeMap.has(key)) {
        edgeMap.set(key, edgePositions.length);
        edgePositions.push({ v1, v2, road: null, player: -1 });
      }
    }
  });

  state.edges = edgePositions;

  // Initialize players
  state.players = PLAYER_NAMES.map((name, i) => ({
    name, color: PLAYER_COLORS[i],
    resources: { wood: 0, brick: 0, wheat: 0, sheep: 0, ore: 0 },
    settlements: [], cities: [], roads: [], vp: 0,
  }));

  state.phase = 'setup1';
  state.currentPlayer = 0;
  state.setupIndex = 0;
  state.setupSettlement = true;
  state.setupRoad = false;

  // Remove old listeners before adding (safe for game reset)
  canvas.removeEventListener('click', handleBoardClick);
  canvas.removeEventListener('mousemove', handleBoardHover);
  canvas.addEventListener('click', handleBoardClick);
  canvas.addEventListener('mousemove', handleBoardHover);

  log('Game started! Setup phase begins.');
  log(`<span class="highlight">${PLAYER_NAMES[0]}</span>: Place a settlement.`);
  updateInstruction();
  updateUI();
  drawBoard();
}

// ============================================
// INSTRUCTION BANNER
// ============================================

function updateInstruction() {
  const banner = document.getElementById('instructionBanner');
  const p = state.currentPlayer;
  const name = PLAYER_NAMES[p];

  if (state.winner !== null) {
    banner.textContent = `${PLAYER_NAMES[state.winner]} wins!`;
  } else if (state.pendingRobber || state.discardQueue.length > 0) {
    banner.textContent = 'Players must discard cards...';
  } else if (state.phase.startsWith('setup') && state.setupSettlement) {
    banner.textContent = `${name}: Click a glowing spot to place a settlement`;
  } else if (state.phase.startsWith('setup') && state.setupRoad) {
    banner.textContent = `${name}: Click a glowing line to place a road`;
  } else if (state.buildMode === 'robber') {
    banner.textContent = `${name}: Click a hex to move the robber`;
  } else if (state.buildMode) {
    banner.textContent = `${name}: Click to place ${state.buildMode} (ESC to cancel)`;
  } else if (state.phase === 'play' && !state.hasRolled) {
    banner.textContent = `${name}'s turn \u2014 Roll the dice \u2192`;
  } else if (state.phase === 'play' && state.hasRolled) {
    banner.textContent = `${name}: Build, trade, or end turn`;
  }
}

// ============================================
// DRAWING
// ============================================

function drawBoard() {
  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawWaterRing();
  state.hexes.forEach((hex, i) => drawHex(hex, i));
  state.edges.forEach((edge) => { if (edge.player >= 0) drawRoad(edge); });
  state.vertices.forEach((v) => { if (v.building) drawBuilding(v); });

  // Draw placement indicators
  const isSetupSettlement = state.phase.startsWith('setup') && state.setupSettlement;
  const isSetupRoad = state.phase.startsWith('setup') && state.setupRoad;

  if (isSetupSettlement || state.buildMode === 'settlement') drawValidSettlementSpots();
  if (isSetupRoad || state.buildMode === 'road') drawValidRoadSpots();
  if (state.buildMode === 'city') drawValidCitySpots();
}

function drawWaterRing() {
  const outerRadius = HEX_SIZE * 6.2;
  ctx.save();
  ctx.translate(boardOffsetX, boardOffsetY);
  ctx.beginPath();
  ctx.arc(0, 0, outerRadius, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(26, 74, 110, 0.15)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(240, 228, 208, 0.08)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

function drawHex(hex, index) {
  ctx.save();
  ctx.translate(boardOffsetX + hex.x, boardOffsetY + hex.y);

  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const angle = (Math.PI / 3) * i - Math.PI / 6;
    const x = HEX_SIZE * Math.cos(angle);
    const y = HEX_SIZE * Math.sin(angle);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();

  const res = hex.resource;
  const grad = ctx.createRadialGradient(0, -10, 0, 0, 0, HEX_SIZE);
  grad.addColorStop(0, RES_LIGHT[res]);
  grad.addColorStop(1, RES_COLORS[res]);
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.strokeStyle = 'rgba(44, 24, 16, 0.4)';
  ctx.lineWidth = 2;
  ctx.stroke();

  const icons = { wood: '\u{1F332}', brick: '\u{1F9F1}', wheat: '\u{1F33E}', sheep: '\u{1F411}', ore: '\u26F0\uFE0F', desert: '\u{1F3DC}\uFE0F' };
  ctx.font = '22px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(icons[res], 0, -14);

  if (hex.number > 0) {
    ctx.beginPath();
    ctx.arc(0, 12, 16, 0, Math.PI * 2);
    ctx.fillStyle = '#f5f0e8';
    ctx.fill();
    const isHot = hex.number === 6 || hex.number === 8;
    ctx.strokeStyle = isHot ? '#c1440e' : '#5a4a3a';
    ctx.lineWidth = isHot ? 2.5 : 1.5;
    ctx.stroke();

    ctx.font = `${isHot ? 'bold ' : ''}15px 'Cinzel', serif`;
    ctx.fillStyle = isHot ? '#c1440e' : '#2c1810';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(hex.number, 0, 13);

    const dots = {2:1,3:2,4:3,5:4,6:5,8:5,9:4,10:3,11:2,12:1}[hex.number] || 0;
    const dotY = 24;
    const startX = -(dots - 1) * 2;
    for (let d = 0; d < dots; d++) {
      ctx.beginPath();
      ctx.arc(startX + d * 4, dotY, 1.5, 0, Math.PI * 2);
      ctx.fillStyle = isHot ? '#c1440e' : '#5a4a3a';
      ctx.fill();
    }
  }

  if (hex.hasRobber) {
    ctx.font = '28px serif';
    ctx.textBaseline = 'middle';
    ctx.fillText('\u{1F3F4}\u200D\u2620\uFE0F', 0, hex.number > 0 ? -14 : 4);
  }

  ctx.restore();
}

function drawRoad(edge) {
  const v1 = state.vertices[edge.v1];
  const v2 = state.vertices[edge.v2];
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(boardOffsetX + v1.x, boardOffsetY + v1.y);
  ctx.lineTo(boardOffsetX + v2.x, boardOffsetY + v2.y);
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 9;
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(boardOffsetX + v1.x, boardOffsetY + v1.y);
  ctx.lineTo(boardOffsetX + v2.x, boardOffsetY + v2.y);
  ctx.strokeStyle = state.players[edge.player].color;
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.restore();
}

function drawBuilding(vertex) {
  const x = boardOffsetX + vertex.x;
  const y = boardOffsetY + vertex.y;
  const color = state.players[vertex.player].color;

  ctx.save();
  if (vertex.building === 'settlement') {
    ctx.beginPath();
    ctx.moveTo(x, y - 12);
    ctx.lineTo(x + 10, y - 2);
    ctx.lineTo(x + 10, y + 8);
    ctx.lineTo(x - 10, y + 8);
    ctx.lineTo(x - 10, y - 2);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y - 11);
    ctx.lineTo(x + 8, y - 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();
  } else if (vertex.building === 'city') {
    ctx.beginPath();
    ctx.moveTo(x - 6, y - 14);
    ctx.lineTo(x + 6, y - 14);
    ctx.lineTo(x + 6, y - 6);
    ctx.lineTo(x + 13, y - 6);
    ctx.lineTo(x + 13, y + 10);
    ctx.lineTo(x - 13, y + 10);
    ctx.lineTo(x - 13, y - 6);
    ctx.lineTo(x - 6, y - 6);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
  ctx.restore();
}

function drawValidSettlementSpots() {
  const valid = getValidSettlementVertices();
  const time = Date.now() / 1000;

  valid.forEach(vi => {
    const v = state.vertices[vi];
    const x = boardOffsetX + v.x;
    const y = boardOffsetY + v.y;
    const isHovered = state.hoveredVertex === vi;
    const pulseSize = 10 + Math.sin(time * 3) * 2;
    const size = isHovered ? 14 : pulseSize;

    ctx.save();

    ctx.beginPath();
    ctx.arc(x, y, size + 4, 0, Math.PI * 2);
    ctx.fillStyle = isHovered ? 'rgba(240, 192, 64, 0.25)' : 'rgba(255, 255, 255, 0.1)';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fillStyle = isHovered ? 'rgba(240, 192, 64, 0.5)' : 'rgba(255, 255, 255, 0.2)';
    ctx.fill();
    ctx.strokeStyle = isHovered ? 'rgba(240, 192, 64, 0.9)' : 'rgba(255, 255, 255, 0.6)';
    ctx.lineWidth = isHovered ? 3 : 2;
    ctx.stroke();

    ctx.strokeStyle = isHovered ? 'rgba(240, 192, 64, 0.9)' : 'rgba(255, 255, 255, 0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - 4, y);
    ctx.lineTo(x + 4, y);
    ctx.moveTo(x, y - 4);
    ctx.lineTo(x, y + 4);
    ctx.stroke();

    ctx.restore();
  });
}

function drawValidRoadSpots() {
  const valid = getValidRoadEdges();
  const time = Date.now() / 1000;

  valid.forEach(ei => {
    const e = state.edges[ei];
    const v1 = state.vertices[e.v1];
    const v2 = state.vertices[e.v2];
    const x1 = boardOffsetX + v1.x, y1 = boardOffsetY + v1.y;
    const x2 = boardOffsetX + v2.x, y2 = boardOffsetY + v2.y;
    const isHovered = state.hoveredEdge === ei;

    ctx.save();

    if (isHovered) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.strokeStyle = 'rgba(240, 192, 64, 0.3)';
      ctx.lineWidth = 14;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = isHovered ? 'rgba(240, 192, 64, 0.8)' : 'rgba(255, 255, 255, 0.35)';
    ctx.lineWidth = isHovered ? 7 : 5;
    ctx.lineCap = 'round';
    const dashOffset = time * 20;
    ctx.setLineDash([6, 6]);
    ctx.lineDashOffset = dashOffset;
    ctx.stroke();

    ctx.restore();
  });
}

function drawValidCitySpots() {
  const p = state.currentPlayer;
  state.players[p].settlements.forEach(vi => {
    const v = state.vertices[vi];
    const x = boardOffsetX + v.x;
    const y = boardOffsetY + v.y;
    const isHovered = state.hoveredVertex === vi;

    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, isHovered ? 16 : 14, 0, Math.PI * 2);
    ctx.strokeStyle = isHovered ? 'rgba(240, 192, 64, 0.9)' : 'rgba(255, 255, 255, 0.6)';
    ctx.lineWidth = isHovered ? 3 : 2;
    ctx.setLineDash([4, 4]);
    ctx.stroke();
    if (isHovered) {
      ctx.fillStyle = 'rgba(240, 192, 64, 0.2)';
      ctx.fill();
    }
    ctx.restore();
  });
}

// ============================================
// GAME LOGIC
// ============================================

function getAdjacentVertices(vi) {
  const results = new Set();
  state.edges.forEach(e => {
    if (e.v1 === vi) results.add(e.v2);
    if (e.v2 === vi) results.add(e.v1);
  });
  return [...results];
}

function getValidSettlementVertices() {
  const p = state.currentPlayer;
  const player = state.players[p];
  if (state.phase === 'play' && player.settlements.length >= MAX_SETTLEMENTS) return [];
  const valid = [];
  state.vertices.forEach((v, vi) => {
    if (v.building) return;
    const adj = getAdjacentVertices(vi);
    if (adj.some(avi => state.vertices[avi].building)) return;
    if (state.phase === 'play') {
      const connected = state.edges.some(e => e.player === p && (e.v1 === vi || e.v2 === vi));
      if (!connected) return;
    }
    valid.push(vi);
  });
  return valid;
}

function getValidRoadEdges() {
  const p = state.currentPlayer;
  const player = state.players[p];
  if (state.phase === 'play' && player.roads.length >= MAX_ROADS) return [];
  const valid = [];
  state.edges.forEach((e, ei) => {
    if (e.player >= 0) return;
    if (state.phase.startsWith('setup') && state.setupRoad) {
      const lastSettlement = player.settlements[player.settlements.length - 1];
      if (e.v1 !== lastSettlement && e.v2 !== lastSettlement) return;
    } else {
      const connected =
        state.vertices[e.v1].player === p ||
        state.vertices[e.v2].player === p ||
        state.edges.some(other =>
          other.player === p && (other.v1 === e.v1 || other.v2 === e.v1 || other.v1 === e.v2 || other.v2 === e.v2)
        );
      if (!connected) return;
    }
    valid.push(ei);
  });
  return valid;
}

// ============================================
// LONGEST ROAD
// ============================================

function calculateLongestRoad(playerIdx) {
  const player = state.players[playerIdx];
  if (player.roads.length === 0) return 0;

  // Build adjacency list for this player's road network
  const adj = {};
  player.roads.forEach(ei => {
    const edge = state.edges[ei];
    if (!adj[edge.v1]) adj[edge.v1] = [];
    if (!adj[edge.v2]) adj[edge.v2] = [];
    adj[edge.v1].push({ to: edge.v2, edge: ei });
    adj[edge.v2].push({ to: edge.v1, edge: ei });
  });

  let maxLength = 0;
  const vertices = Object.keys(adj).map(Number);

  vertices.forEach(startV => {
    const visited = new Set();
    function dfs(v, length) {
      if (length > maxLength) maxLength = length;
      const neighbors = adj[v] || [];
      for (const { to, edge } of neighbors) {
        if (visited.has(edge)) continue;
        // Opponent buildings block road continuity
        const blocked = state.vertices[to].building && state.vertices[to].player !== playerIdx;
        visited.add(edge);
        if (!blocked) {
          dfs(to, length + 1);
        } else {
          if (length + 1 > maxLength) maxLength = length + 1;
        }
        visited.delete(edge);
      }
    }
    dfs(startV, 0);
  });

  return maxLength;
}

function updateLongestRoad() {
  const lengths = state.players.map((_, i) => calculateLongestRoad(i));
  const maxLen = Math.max(...lengths);

  if (maxLen < 5) {
    if (state.longestRoadPlayer >= 0) {
      state.players[state.longestRoadPlayer].vp -= 2;
      log(`<span class="highlight">${PLAYER_NAMES[state.longestRoadPlayer]}</span> lost Longest Road.`);
      state.longestRoadPlayer = -1;
    }
    return;
  }

  const candidates = [];
  lengths.forEach((len, i) => {
    if (len === maxLen) candidates.push(i);
  });

  if (candidates.length === 1) {
    const newHolder = candidates[0];
    if (newHolder !== state.longestRoadPlayer) {
      if (state.longestRoadPlayer >= 0) {
        state.players[state.longestRoadPlayer].vp -= 2;
      }
      state.longestRoadPlayer = newHolder;
      state.players[newHolder].vp += 2;
      log(`<span class="highlight">${PLAYER_NAMES[newHolder]}</span> has Longest Road! (+2 VP)`);
    }
  } else {
    // Tie: current holder keeps it if among tied, otherwise no one has it
    if (state.longestRoadPlayer >= 0 && !candidates.includes(state.longestRoadPlayer)) {
      state.players[state.longestRoadPlayer].vp -= 2;
      log(`<span class="highlight">${PLAYER_NAMES[state.longestRoadPlayer]}</span> lost Longest Road.`);
      state.longestRoadPlayer = -1;
    }
  }
}

// ============================================
// HOVER
// ============================================

function handleBoardHover(event) {
  const { x: mx, y: my } = getMousePos(event);
  let cursor = state.buildMode === 'robber' ? 'crosshair' : 'default';
  const oldV = state.hoveredVertex;
  const oldE = state.hoveredEdge;
  state.hoveredVertex = -1;
  state.hoveredEdge = -1;

  const isSetupSettlement = state.phase.startsWith('setup') && state.setupSettlement;
  const isSetupRoad = state.phase.startsWith('setup') && state.setupRoad;

  // Check vertex hover
  if (isSetupSettlement || state.buildMode === 'settlement') {
    const valid = getValidSettlementVertices();
    let closest = -1, closestDist = 25;
    valid.forEach(vi => {
      const v = state.vertices[vi];
      const d = Math.hypot(boardOffsetX + v.x - mx, boardOffsetY + v.y - my);
      if (d < closestDist) { closestDist = d; closest = vi; }
    });
    if (closest >= 0) {
      state.hoveredVertex = closest;
      cursor = 'pointer';
    }
  }

  if (state.buildMode === 'city') {
    const p = state.currentPlayer;
    let closest = -1, closestDist = 25;
    state.players[p].settlements.forEach(vi => {
      const v = state.vertices[vi];
      const d = Math.hypot(boardOffsetX + v.x - mx, boardOffsetY + v.y - my);
      if (d < closestDist) { closestDist = d; closest = vi; }
    });
    if (closest >= 0) {
      state.hoveredVertex = closest;
      cursor = 'pointer';
    }
  }

  // Check edge hover
  if (isSetupRoad || state.buildMode === 'road') {
    const valid = getValidRoadEdges();
    let closest = -1, closestDist = 22;
    valid.forEach(ei => {
      const e = state.edges[ei];
      const v1 = state.vertices[e.v1];
      const v2 = state.vertices[e.v2];
      const d = pointToSegmentDist(mx, my,
        boardOffsetX + v1.x, boardOffsetY + v1.y,
        boardOffsetX + v2.x, boardOffsetY + v2.y);
      if (d < closestDist) { closestDist = d; closest = ei; }
    });
    if (closest >= 0) {
      state.hoveredEdge = closest;
      cursor = 'pointer';
    }
  }

  // Robber hover
  if (state.buildMode === 'robber') {
    state.hexes.forEach((hex, hi) => {
      if (hi === state.robberHex) return;
      const d = Math.hypot(boardOffsetX + hex.x - mx, boardOffsetY + hex.y - my);
      if (d < HEX_SIZE * 0.8) cursor = 'pointer';
    });
  }

  canvas.style.cursor = cursor;

  if (state.hoveredVertex !== oldV || state.hoveredEdge !== oldE) {
    drawBoard();
  }
}

function pointToSegmentDist(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const lenSq = dx * dx + dy * dy;
  let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  const cx = x1 + t * dx, cy = y1 + t * dy;
  return Math.hypot(px - cx, py - cy);
}

// ============================================
// CLICK
// ============================================

function handleBoardClick(event) {
  if (state.winner !== null) return;
  if (state.pendingRobber) return;

  const { x: mx, y: my } = getMousePos(event);

  // Settlement placement
  if ((state.phase.startsWith('setup') && state.setupSettlement) || state.buildMode === 'settlement') {
    const valid = getValidSettlementVertices();
    let closest = -1, closestDist = 25;
    valid.forEach(vi => {
      const v = state.vertices[vi];
      const d = Math.hypot(boardOffsetX + v.x - mx, boardOffsetY + v.y - my);
      if (d < closestDist) { closestDist = d; closest = vi; }
    });
    if (closest >= 0) { placeSettlement(closest); return; }
  }

  // Road placement
  if ((state.phase.startsWith('setup') && state.setupRoad) || state.buildMode === 'road') {
    const valid = getValidRoadEdges();
    let closest = -1, closestDist = 22;
    valid.forEach(ei => {
      const e = state.edges[ei];
      const v1 = state.vertices[e.v1];
      const v2 = state.vertices[e.v2];
      const d = pointToSegmentDist(mx, my,
        boardOffsetX + v1.x, boardOffsetY + v1.y,
        boardOffsetX + v2.x, boardOffsetY + v2.y);
      if (d < closestDist) { closestDist = d; closest = ei; }
    });
    if (closest >= 0) { placeRoad(closest); return; }
  }

  // City upgrade
  if (state.buildMode === 'city') {
    const p = state.currentPlayer;
    let closest = -1, closestDist = 25;
    state.players[p].settlements.forEach(vi => {
      const v = state.vertices[vi];
      const d = Math.hypot(boardOffsetX + v.x - mx, boardOffsetY + v.y - my);
      if (d < closestDist) { closestDist = d; closest = vi; }
    });
    if (closest >= 0) { upgradeCity(closest); return; }
  }

  // Robber
  if (state.buildMode === 'robber') {
    let closest = -1, closestDist = HEX_SIZE;
    state.hexes.forEach((hex, hi) => {
      if (hi === state.robberHex) return;
      const d = Math.hypot(boardOffsetX + hex.x - mx, boardOffsetY + hex.y - my);
      if (d < closestDist) { closestDist = d; closest = hi; }
    });
    if (closest >= 0) {
      state.hexes[state.robberHex].hasRobber = false;
      state.hexes[closest].hasRobber = true;
      state.robberHex = closest;
      state.buildMode = null;
      log(`<span class="highlight">${PLAYER_NAMES[state.currentPlayer]}</span> moved the robber.`);
      handleRobberSteal(closest);
      updateInstruction();
      drawBoard();
      updateUI();
    }
  }
}

// ============================================
// ROBBER STEAL
// ============================================

function handleRobberSteal(hexIdx) {
  const p = state.currentPlayer;
  const targets = new Set();
  state.hexes[hexIdx].vertices.forEach(vi => {
    const v = state.vertices[vi];
    if (v.building && v.player !== p) {
      const totalRes = Object.values(state.players[v.player].resources).reduce((a, b) => a + b, 0);
      if (totalRes > 0) targets.add(v.player);
    }
  });

  const targetList = [...targets];
  if (targetList.length === 0) {
    log('No one to steal from.');
  } else if (targetList.length === 1) {
    stealFrom(targetList[0]);
  } else {
    showStealChoice(targetList);
  }
}

function stealFrom(targetPlayer) {
  const target = state.players[targetPlayer];
  const available = [];
  for (const r of RESOURCES) {
    for (let i = 0; i < target.resources[r]; i++) {
      available.push(r);
    }
  }
  if (available.length === 0) return;

  const stolen = available[Math.floor(Math.random() * available.length)];
  target.resources[stolen]--;
  state.players[state.currentPlayer].resources[stolen]++;
  log(`<span class="highlight">${PLAYER_NAMES[state.currentPlayer]}</span> stole from <span class="highlight">${PLAYER_NAMES[targetPlayer]}</span>.`);
  updateUI();
}

function showStealChoice(targets) {
  document.getElementById('stealOptions').innerHTML = targets.map(pi => `
    <button class="steal-option-btn" onclick="selectStealTarget(${pi})">
      <div class="steal-dot" style="background:${PLAYER_COLORS[pi]}"></div>
      <span>${PLAYER_NAMES[pi]}</span>
    </button>
  `).join('');
  document.getElementById('stealModal').classList.add('show');
}

function selectStealTarget(pi) {
  document.getElementById('stealModal').classList.remove('show');
  stealFrom(pi);
}

// ============================================
// DISCARD ON 7
// ============================================

let discardSelections = { wood: 0, brick: 0, wheat: 0, sheep: 0, ore: 0 };
let discardRequired = 0;
let discardPlayer = -1;

function promptNextDiscard() {
  if (state.discardQueue.length === 0) {
    if (state.pendingRobber) {
      state.pendingRobber = false;
      state.buildMode = 'robber';
      log('Move the robber.');
      updateInstruction();
      drawBoard();
      updateUI();
    }
    return;
  }

  const pi = state.discardQueue.shift();
  discardPlayer = pi;
  const p = state.players[pi];
  const total = Object.values(p.resources).reduce((a, b) => a + b, 0);
  discardRequired = Math.floor(total / 2);
  discardSelections = { wood: 0, brick: 0, wheat: 0, sheep: 0, ore: 0 };
  showDiscardModal();
}

function showDiscardModal() {
  const p = state.players[discardPlayer];
  document.getElementById('discardTitle').textContent = `${PLAYER_NAMES[discardPlayer]} \u2014 Discard Cards`;

  const selected = Object.values(discardSelections).reduce((a, b) => a + b, 0);
  document.getElementById('discardInfo').textContent = `Select ${discardRequired} cards to discard (${selected}/${discardRequired} selected)`;

  document.getElementById('discardResources').innerHTML = RESOURCES.map(r => `
    <div class="trade-row">
      <label>${RES_EMOJI[r]} ${r} (${p.resources[r]})</label>
      <div class="trade-controls">
        <button onclick="adjustDiscard('${r}', -1)">\u2212</button>
        <span>${discardSelections[r]}</span>
        <button onclick="adjustDiscard('${r}', 1)">+</button>
      </div>
    </div>
  `).join('');

  document.getElementById('discardConfirmBtn').disabled = selected !== discardRequired;
  document.getElementById('discardModal').classList.add('show');
}

function adjustDiscard(res, amount) {
  const p = state.players[discardPlayer];
  let newVal = discardSelections[res] + amount;
  newVal = Math.max(0, Math.min(p.resources[res], newVal));
  const totalOthers = Object.values(discardSelections).reduce((a, b) => a + b, 0) - discardSelections[res];
  newVal = Math.min(newVal, discardRequired - totalOthers);
  discardSelections[res] = newVal;
  showDiscardModal();
}

function executeDiscard() {
  const p = state.players[discardPlayer];
  for (const r of RESOURCES) {
    p.resources[r] -= discardSelections[r];
  }
  const total = Object.values(discardSelections).reduce((a, b) => a + b, 0);
  log(`<span class="highlight">${PLAYER_NAMES[discardPlayer]}</span> discarded ${total} cards.`);
  document.getElementById('discardModal').classList.remove('show');
  updateUI();
  promptNextDiscard();
}

// ============================================
// PLACEMENT ACTIONS
// ============================================

function placeSettlement(vi) {
  const p = state.currentPlayer;
  state.vertices[vi].building = 'settlement';
  state.vertices[vi].player = p;
  state.players[p].settlements.push(vi);
  state.players[p].vp++;
  state.hoveredVertex = -1;

  log(`<span class="highlight">${PLAYER_NAMES[p]}</span> built a settlement.`);

  if (state.phase === 'setup2') {
    state.vertices[vi].hexes.forEach(hi => {
      const hex = state.hexes[hi];
      if (hex.resource !== 'desert') {
        state.players[p].resources[hex.resource]++;
      }
    });
  }

  if (state.phase.startsWith('setup')) {
    state.setupSettlement = false;
    state.setupRoad = true;
    log(`<span class="highlight">${PLAYER_NAMES[p]}</span>: Place a road.`);
  } else {
    state.players[p].resources.wood--;
    state.players[p].resources.brick--;
    state.players[p].resources.wheat--;
    state.players[p].resources.sheep--;
    state.buildMode = null;
  }

  checkWin();
  updateInstruction();
  drawBoard();
  updateUI();
}

function placeRoad(ei) {
  const p = state.currentPlayer;
  state.edges[ei].player = p;
  state.players[p].roads.push(ei);
  state.hoveredEdge = -1;

  log(`<span class="highlight">${PLAYER_NAMES[p]}</span> built a road.`);

  if (state.phase.startsWith('setup')) {
    state.setupRoad = false;
    advanceSetup();
  } else {
    state.players[p].resources.wood--;
    state.players[p].resources.brick--;
    state.buildMode = null;
  }

  updateLongestRoad();
  checkWin();
  updateInstruction();
  drawBoard();
  updateUI();
}

function upgradeCity(vi) {
  const p = state.currentPlayer;
  state.vertices[vi].building = 'city';
  state.players[p].settlements = state.players[p].settlements.filter(s => s !== vi);
  state.players[p].cities.push(vi);
  state.players[p].vp++;
  state.players[p].resources.wheat -= 2;
  state.players[p].resources.ore -= 3;
  state.buildMode = null;
  state.hoveredVertex = -1;

  log(`<span class="highlight">${PLAYER_NAMES[p]}</span> built a city!`);
  updateLongestRoad();
  checkWin();
  updateInstruction();
  drawBoard();
  updateUI();
}

function advanceSetup() {
  state.setupIndex++;

  if (state.setupIndex < 4) {
    state.currentPlayer = state.turnOrder[state.setupIndex];
    state.phase = 'setup1';
  } else if (state.setupIndex < 8) {
    state.currentPlayer = state.turnOrder[state.setupIndex];
    state.phase = 'setup2';
  } else {
    state.phase = 'play';
    state.currentPlayer = 0;
    state.hasRolled = false;
    log(`Setup complete! <span class="highlight">${PLAYER_NAMES[0]}</span>'s turn \u2014 roll the dice.`);
    showToast('Setup complete! Let\'s play!');
    updateInstruction();
    updateUI();
    return;
  }

  state.setupSettlement = true;
  state.setupRoad = false;
  log(`<span class="highlight">${PLAYER_NAMES[state.currentPlayer]}</span>: Place a settlement.`);
  updateInstruction();
  updateUI();
}

// ============================================
// TURN ACTIONS
// ============================================

function rollDice() {
  if (state.phase !== 'play' || state.hasRolled || state.winner !== null) return;

  const d1 = Math.floor(Math.random() * 6) + 1;
  const d2 = Math.floor(Math.random() * 6) + 1;
  const total = d1 + d2;
  state.diceRoll = total;
  state.hasRolled = true;

  const die1 = document.getElementById('die1');
  const die2 = document.getElementById('die2');
  die1.classList.add('rolling');
  die2.classList.add('rolling');
  setTimeout(() => {
    die1.textContent = d1;
    die2.textContent = d2;
    die1.classList.remove('rolling');
    die2.classList.remove('rolling');
    document.getElementById('diceTotal').textContent = `Total: ${total}`;
  }, 400);

  log(`<span class="highlight">${PLAYER_NAMES[state.currentPlayer]}</span> rolled ${d1} + ${d2} = <span class="highlight">${total}</span>`);

  if (total === 7) {
    // Build discard queue for players with >7 cards
    state.discardQueue = [];
    state.players.forEach((p, i) => {
      const count = Object.values(p.resources).reduce((a, b) => a + b, 0);
      if (count > 7) {
        state.discardQueue.push(i);
      }
    });

    if (state.discardQueue.length > 0) {
      state.pendingRobber = true;
      log('Robber activated! Players must discard first.');
      updateInstruction();
      updateUI();
      promptNextDiscard();
    } else {
      state.buildMode = 'robber';
      log('Robber activated! Move the robber.');
      updateInstruction();
      updateUI();
      drawBoard();
    }
  } else {
    // Distribute resources with feedback
    const received = {};
    state.hexes.forEach((hex) => {
      if (hex.number === total && !hex.hasRobber && hex.resource !== 'desert') {
        hex.vertices.forEach(vi => {
          const v = state.vertices[vi];
          if (v.building === 'settlement') {
            state.players[v.player].resources[hex.resource]++;
            if (!received[v.player]) received[v.player] = {};
            received[v.player][hex.resource] = (received[v.player][hex.resource] || 0) + 1;
          } else if (v.building === 'city') {
            state.players[v.player].resources[hex.resource] += 2;
            if (!received[v.player]) received[v.player] = {};
            received[v.player][hex.resource] = (received[v.player][hex.resource] || 0) + 2;
          }
        });
      }
    });

    let anyProduced = false;
    state.players.forEach((p, i) => {
      if (received[i]) {
        anyProduced = true;
        const parts = Object.entries(received[i]).map(([r, count]) => `${count} ${r}`);
        log(`<span class="highlight">${PLAYER_NAMES[i]}</span> received ${parts.join(', ')}.`);
      }
    });
    if (!anyProduced) {
      log('No resources produced.');
    }

    updateInstruction();
    updateUI();
    drawBoard();
  }
}

function startBuild(type) {
  if (state.winner !== null) return;
  state.buildMode = state.buildMode === type ? null : type;
  updateInstruction();
  drawBoard();
  updateUI();
}

function endTurn() {
  if (state.phase !== 'play' || !state.hasRolled || state.winner !== null) return;
  if (state.buildMode === 'robber' || state.pendingRobber) return;

  state.currentPlayer = (state.currentPlayer + 1) % 4;
  state.hasRolled = false;
  state.buildMode = null;
  state.diceRoll = null;
  state.hoveredVertex = -1;
  state.hoveredEdge = -1;

  document.getElementById('die1').textContent = '\u2013';
  document.getElementById('die2').textContent = '\u2013';
  document.getElementById('diceTotal').textContent = '';

  log(`<span class="highlight">${PLAYER_NAMES[state.currentPlayer]}</span>'s turn.`);
  showToast(`${PLAYER_NAMES[state.currentPlayer]}'s Turn`);
  updateInstruction();
  updateUI();
  drawBoard();
}

function canAfford(type) {
  const p = state.players[state.currentPlayer];
  const r = p.resources;
  switch (type) {
    case 'road': return r.wood >= 1 && r.brick >= 1 && p.roads.length < MAX_ROADS;
    case 'settlement': return r.wood >= 1 && r.brick >= 1 && r.wheat >= 1 && r.sheep >= 1 && p.settlements.length < MAX_SETTLEMENTS;
    case 'city': return r.wheat >= 2 && r.ore >= 3 && p.cities.length < MAX_CITIES && p.settlements.length > 0;
  }
  return false;
}

function checkWin() {
  state.players.forEach((p, i) => {
    if (p.vp >= 10 && state.winner === null) {
      state.winner = i;
      showToast(`${PLAYER_NAMES[i]} wins with ${p.vp} Victory Points!`);
      log(`<span class="highlight">${PLAYER_NAMES[i]} wins the game!</span>`);
    }
  });
}

// ============================================
// TRADE
// ============================================

let tradeGive = { wood: 0, brick: 0, wheat: 0, sheep: 0, ore: 0 };
let tradeReceive = { wood: 0, brick: 0, wheat: 0, sheep: 0, ore: 0 };

function openTrade() {
  if (state.phase !== 'play' || !state.hasRolled || state.winner !== null) return;
  tradeGive = { wood: 0, brick: 0, wheat: 0, sheep: 0, ore: 0 };
  tradeReceive = { wood: 0, brick: 0, wheat: 0, sheep: 0, ore: 0 };
  renderTrade();
  document.getElementById('tradeModal').classList.add('show');
}

function closeTrade() {
  document.getElementById('tradeModal').classList.remove('show');
}

function renderTrade() {
  const p = state.players[state.currentPlayer];
  document.getElementById('tradeGive').innerHTML = RESOURCES.map(r => `
    <div class="trade-row">
      <label>${RES_EMOJI[r]} ${r} (${p.resources[r]})</label>
      <div class="trade-controls">
        <button onclick="adjustTrade('give','${r}',-4)">\u2212</button>
        <span>${tradeGive[r]}</span>
        <button onclick="adjustTrade('give','${r}',4)">+</button>
      </div>
    </div>
  `).join('');
  document.getElementById('tradeReceive').innerHTML = RESOURCES.map(r => `
    <div class="trade-row">
      <label>${RES_EMOJI[r]} ${r}</label>
      <div class="trade-controls">
        <button onclick="adjustTrade('receive','${r}',-1)">\u2212</button>
        <span>${tradeReceive[r]}</span>
        <button onclick="adjustTrade('receive','${r}',1)">+</button>
      </div>
    </div>
  `).join('');
}

function adjustTrade(side, res, amount) {
  const obj = side === 'give' ? tradeGive : tradeReceive;
  obj[res] = Math.max(0, obj[res] + amount);
  if (side === 'give') {
    obj[res] = Math.min(obj[res], Math.floor(state.players[state.currentPlayer].resources[res] / 4) * 4);
  }
  renderTrade();
}

function executeTrade() {
  const totalGive = Object.values(tradeGive).reduce((a, b) => a + b, 0);
  const totalReceive = Object.values(tradeReceive).reduce((a, b) => a + b, 0);
  if (totalGive === 0 || totalReceive === 0) { showToast('Select resources to trade'); return; }
  if (totalGive / 4 !== totalReceive) { showToast('Trade must be 4:1 ratio'); return; }
  const p = state.players[state.currentPlayer];
  for (const r of RESOURCES) {
    if (tradeGive[r] > p.resources[r]) { showToast('Not enough resources'); return; }
  }
  for (const r of RESOURCES) {
    p.resources[r] -= tradeGive[r];
    p.resources[r] += tradeReceive[r];
  }
  log(`<span class="highlight">${PLAYER_NAMES[state.currentPlayer]}</span> traded with the bank.`);
  closeTrade();
  updateUI();
}

// ============================================
// NEW GAME
// ============================================

function confirmNewGame() {
  if (state.winner !== null) {
    resetGame();
    return;
  }
  if (confirm('Start a new game? Current progress will be lost.')) {
    resetGame();
  }
}

function resetGame() {
  if (animFrame) cancelAnimationFrame(animFrame);

  state = createInitialState();

  document.getElementById('logMessages').innerHTML = '';
  document.getElementById('die1').textContent = '\u2013';
  document.getElementById('die2').textContent = '\u2013';
  document.getElementById('diceTotal').textContent = '';

  document.getElementById('tradeModal').classList.remove('show');
  document.getElementById('stealModal').classList.remove('show');
  document.getElementById('discardModal').classList.remove('show');

  initBoard();
  animLoop();
}

// ============================================
// UI
// ============================================

function updateUI() {
  const pc = document.getElementById('players-container');
  const gameWon = state.winner !== null;

  pc.innerHTML = state.players.map((p, i) => {
    const isCurrentOrRevealed = i === state.currentPlayer || gameWon;
    const totalCards = Object.values(p.resources).reduce((a, b) => a + b, 0);
    const lrBadge = state.longestRoadPlayer === i ? '<span class="lr-badge">LR</span>' : '';

    let resourcesHtml;
    if (isCurrentOrRevealed) {
      resourcesHtml = `<div class="player-resources">
        ${RESOURCES.map(r => `
          <span class="res-badge">
            <span class="res-icon">${RES_EMOJI[r]}</span>
            <span>${p.resources[r]}</span>
          </span>
        `).join('')}
      </div>`;
    } else {
      resourcesHtml = `<div class="card-count">${totalCards} card${totalCards !== 1 ? 's' : ''}</div>`;
    }

    return `
    <div class="player-card ${i === state.currentPlayer ? 'active' : ''}">
      <div class="player-header">
        <div class="player-dot" style="background:${p.color}"></div>
        <span class="player-name">${p.name}${lrBadge}</span>
        <span class="player-vp">${p.vp}</span>
      </div>
      ${resourcesHtml}
      <div class="player-buildings">
        <span>\u{1F3E0} ${p.settlements.length}/${MAX_SETTLEMENTS}</span>
        <span>\u{1F3D9}\uFE0F ${p.cities.length}/${MAX_CITIES}</span>
        <span>\u{1F6E4}\uFE0F ${p.roads.length}/${MAX_ROADS}</span>
      </div>
    </div>`;
  }).join('');

  const isPlay = state.phase === 'play';
  const rolled = state.hasRolled;
  const won = state.winner !== null;
  const acting = state.buildMode === 'robber' || state.pendingRobber;

  document.getElementById('rollBtn').disabled = !isPlay || rolled || won;
  document.getElementById('endTurnBtn').disabled = !isPlay || !rolled || acting || won;
  document.getElementById('buildRoadBtn').disabled = !isPlay || !rolled || !canAfford('road') || won || acting;
  document.getElementById('buildSettlementBtn').disabled = !isPlay || !rolled || !canAfford('settlement') || won || acting;
  document.getElementById('buildCityBtn').disabled = !isPlay || !rolled || !canAfford('city') || won || acting;
  document.getElementById('tradeBankBtn').disabled = !isPlay || !rolled || won || acting;

  ['Road', 'Settlement', 'City'].forEach(type => {
    const btn = document.getElementById(`build${type}Btn`);
    const active = state.buildMode === type.toLowerCase();
    btn.style.borderColor = active ? 'rgba(218, 165, 32, 0.8)' : '';
    btn.style.background = active ? 'rgba(218, 165, 32, 0.15)' : '';
  });
}

function log(msg) {
  const container = document.getElementById('logMessages');
  const div = document.createElement('div');
  div.className = 'log-msg';
  div.innerHTML = msg;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// ============================================
// KEYBOARD SHORTCUTS
// ============================================

document.addEventListener('keydown', (e) => {
  const modalOpen = document.getElementById('tradeModal').classList.contains('show') ||
                    document.getElementById('stealModal').classList.contains('show') ||
                    document.getElementById('discardModal').classList.contains('show');

  if (e.key === 'Escape') {
    if (document.getElementById('tradeModal').classList.contains('show')) {
      closeTrade();
    } else if (state.buildMode && state.buildMode !== 'robber') {
      state.buildMode = null;
      updateInstruction();
      drawBoard();
      updateUI();
    }
    return;
  }

  if (modalOpen) return;

  switch (e.key.toLowerCase()) {
    case 'r': rollDice(); break;
    case 'e': endTurn(); break;
    case 't': openTrade(); break;
    case '1': startBuild('road'); break;
    case '2': startBuild('settlement'); break;
    case '3': startBuild('city'); break;
  }
});

// Animation loop for pulsing indicators
let animFrame;
function animLoop() {
  const needsAnim =
    (state.phase.startsWith('setup') && (state.setupSettlement || state.setupRoad)) ||
    state.buildMode === 'settlement' ||
    state.buildMode === 'road' ||
    state.buildMode === 'city';

  if (needsAnim) drawBoard();
  animFrame = requestAnimationFrame(animLoop);
}

// ============================================
// INIT
// ============================================

window.addEventListener('load', () => {
  initBoard();
  animLoop();
});

window.addEventListener('resize', () => {
  const area = document.getElementById('boardArea');
  const dpr = window.devicePixelRatio || 1;
  const w = area.clientWidth;
  const h = area.clientHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  boardOffsetX = w / 2;
  boardOffsetY = h / 2;
  drawBoard();
});
</script>
